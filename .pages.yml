media:
  - name: media
    label: Media
    input: public/media
    output: /media
    path: /media

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    fields:
      - name: title
        label: Title
        type: string
      - name: pubDate
        label: Publication Date
        type: date
      - name: description
        label: Description
        type: string
      - name: moreInfoLink
        label: More Info Link
        type: url
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
      - name: heroImage
        label: Heroimage
        type: image
        description: Image used as cover        
      - name: body
        label: Body
        type: rich-text

  - name: projects
    label: Side Projects
    type: file
    path: src/data/projects.json
    fields:
      - name: intro
        label: Section intro
        type: string
        description: Short line shown under the "Other Projects" heading
      - name: overrides
        label: Per-repo overrides
        type: object
        list: true
        description: >-
          Optional. New repos appear automatically; add an entry only to tweak
          one. "Repo name" must match the GitHub repo exactly.
        fields:
          - name: repo
            label: Repo name (exact)
            type: string
          - name: hide
            label: Hide from list
            type: boolean
          - name: pin
            label: Pin order (lower = higher)
            type: number
          - name: description
            label: Custom description
            type: string
